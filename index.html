<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Computacional</title><link rel="stylesheet" href="css/styles.css"></head>
<body><main class="card"><h1>Quiz Computacional</h1><p id="status" aria-live="polite">Carregando questões...</p><section id="start" hidden><p>Pratique seus conhecimentos básicos de Computação em 10 questões.</p><button id="start-quiz" type="button">Iniciar quiz</button></section><section id="quiz" hidden><p id="progress"></p><form id="question-form"><fieldset><legend id="question"></legend><div id="choices"></div></fieldset><button id="confirm" type="submit">Confirmar resposta</button></form><div id="feedback" role="status" aria-live="polite" tabindex="-1"></div><button id="next" type="button" hidden>Próxima questão</button></section><section id="result" hidden><h2>Resultado final</h2><p id="score"></p><button id="restart" type="button">Reiniciar quiz</button></section></main><script type="module" src="js/app.js"></script></body>
</html>
